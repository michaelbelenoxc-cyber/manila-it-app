<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=Epilogue:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; }

  .navbar {
    width: 100%;
    min-height: 54px;
    padding: 0 28px;
    position: fixed;
    top: 0; left: 0;
    z-index: 1000;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 20px;
    background: #f5f2ec;
    border-bottom: 1px solid rgba(26,24,20,.22);
  }

  html[data-theme="dark"] .navbar {
    background: #161410;
    border-bottom: 1px solid rgba(240,236,227,.18);
  }

  .nav-left,
  .nav-center-wrapper,
  .nav-right {
    min-width: 0;
    display: flex;
    align-items: center;
  }

  .nav-left  { justify-content: flex-start; gap: 12px; }
  .nav-center-wrapper { justify-content: center; overflow: hidden; }
  .nav-right { justify-content: flex-end; gap: 10px; }

  /* ── Brand ── */
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    user-select: none;
    cursor: pointer;
    flex-shrink: 0;
  }

  .brand-logo {
    height: 28px;
    width: auto;
    object-fit: contain;
    display: block;
    flex-shrink: 0;
  }

 .brand-logo {
  filter: invert(1);  /* logo is white by default → invert to dark on light bg */
}

html[data-theme="dark"] .brand-logo {
  filter: none;  /* keep white on dark bg */
}

  .brand-sep {
    width: 1px;
    height: 18px;
    background: rgba(26,24,20,.22);
    margin: 0 4px 0 2px;
    flex-shrink: 0;
  }

  html[data-theme="dark"] .brand-sep {
    background: rgba(240,236,227,.18);
  }

  /* ── Nav items ── */
  .nav-center {
    display: flex;
    align-items: center;
    gap: 0;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
  }

  .nav-center::-webkit-scrollbar { display: none; }

  .nav-item {
    flex: 0 0 auto;
    padding: 6px 12px;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #8a8680;
    cursor: pointer;
    border-radius: 0;
    user-select: none;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color .15s ease, border-color .15s ease;
  }

  .nav-item:hover {
    color: #4a4740;
  }

  html[data-theme="dark"] .nav-item {
    color: #6a645c;
  }

  html[data-theme="dark"] .nav-item:hover {
    color: #b0a99e;
  }

  .nav-item.active {
    color: #1a1814;
    border-bottom-color: #1a1814;
    font-weight: 500;
  }

  html[data-theme="dark"] .nav-item.active {
    color: #f0ece3;
    border-bottom-color: #f0ece3;
  }

  /* ── Theme button ── */
  .themeBtn {
    background: none;
    border: none;
    color: #8a8680;
    font-size: 13px;
    cursor: pointer;
    width: 30px; height: 30px;
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    transition: color .15s ease, background .15s ease;
  }

  .themeBtn:hover {
    color: #1a1814;
    background: #ede9e1;
  }

  html[data-theme="dark"] .themeBtn {
    color: #6a645c;
  }

  html[data-theme="dark"] .themeBtn:hover {
    color: #f0ece3;
    background: #1e1c18;
  }

  /* ── Avatar ── */
  .profileWrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .avatar {
    width: 30px; height: 30px;
    border-radius: 5px;
    background: #ede9e1;
    border: 1px solid rgba(26,24,20,.22);
    color: #4a4740;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 10px; font-weight: 500;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    user-select: none;
    overflow: hidden;
    transition: background .15s ease;
  }

  .avatar:hover {
    background: #e4ded4;
  }

  html[data-theme="dark"] .avatar {
    background: #1e1c18;
    border-color: rgba(240,236,227,.18);
    color: #b0a99e;
  }

  html[data-theme="dark"] .avatar:hover {
    background: #252220;
  }

  #navAvatarImg {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 5px;
    display: none;
  }

  /* ── Dropdown ── */
  .dropdown-panel {
    position: absolute;
    top: calc(100% + 8px); right: 0;
    width: 200px;
    background: #f5f2ec;
    border: 1px solid rgba(26,24,20,.22);
    border-radius: 6px;
    padding: 6px;
    display: none;
    flex-direction: column;
    z-index: 2000;
  }

  html[data-theme="dark"] .dropdown-panel {
    background: #161410;
    border-color: rgba(240,236,227,.18);
  }

  .dropdown-user {
    padding: 8px 10px 8px;
    border-bottom: 1px solid rgba(26,24,20,.12);
    margin-bottom: 4px;
  }

  html[data-theme="dark"] .dropdown-user {
    border-bottom-color: rgba(240,236,227,.10);
  }

  .dropdown-user-name {
    font-family: 'Epilogue', system-ui, sans-serif;
    font-size: 13px; font-weight: 600;
    color: #1a1814;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .dropdown-user-role {
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 9px; font-weight: 400;
    color: #8a8680;
    margin-top: 2px;
    text-transform: uppercase; letter-spacing: .08em;
  }

  html[data-theme="dark"] .dropdown-user-name { color: #f0ece3; }
  html[data-theme="dark"] .dropdown-user-role { color: #6a645c; }

  .dropdown-item {
    padding: 8px 10px;
    font-family: 'Epilogue', system-ui, sans-serif;
    font-size: 12.5px; font-weight: 500;
    color: #4a4740;
    border-radius: 4px;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    transition: background .13s ease, color .13s ease;
  }

  .dropdown-item i {
    width: 14px; text-align: center;
    font-size: 12px; opacity: .65;
  }

  .dropdown-item:hover {
    background: #ede9e1;
    color: #1a1814;
  }

  html[data-theme="dark"] .dropdown-item { color: #b0a99e; }
  html[data-theme="dark"] .dropdown-item:hover {
    background: #1e1c18;
    color: #f0ece3;
  }

  .dropdown-item.logout-sep {
    border-top: 1px solid rgba(26,24,20,.12);
    margin-top: 4px;
    padding-top: 9px;
    color: #c94040;
  }

  .dropdown-item.logout-sep i { opacity: 1; }
  .dropdown-item.logout-sep:hover { background: rgba(201,64,64,.08); color: #c94040; }

  html[data-theme="dark"] .dropdown-item.logout-sep {
    border-top-color: rgba(240,236,227,.10);
    color: #c94040;
  }

  html[data-theme="dark"] .dropdown-item.logout-sep:hover {
    background: rgba(201,64,64,.12);
    color: #c94040;
  }

  /* ── Responsive ── */
  @media (max-width: 1200px) {
    .navbar { padding: 0 20px; gap: 14px; }
    .nav-item { padding: 6px 10px; }
  }

  @media (max-width: 900px) {
    .nav-left { display: none; }
    .navbar { grid-template-columns: minmax(0,1fr) auto; }
    .nav-center-wrapper { justify-content: flex-start; }
  }

  @media (max-width: 640px) {
    .navbar { padding: 0 12px; }
    .nav-item { font-size: 9.5px; padding: 6px 8px; }
  }
</style>

<script>
(function NavbarModule() {
  'use strict';

  const $ = (sel, root) => (root || document).querySelector(sel);

  const state = {
    currentPage: '',
    user: null,
    perms: null
  };

  /* =========================================================
   * HELPERS
   * ======================================================= */
  function normalizePage(value) {
    return String(value || '').trim().toLowerCase();
  }

  function getShellBootstrap() {
    return window.__SHELL_BOOTSTRAP__ || null;
  }

  function getSessionEmail() {
    const boot = getShellBootstrap();
    return String(
      window.__SHELL_EMAIL__ ||
      boot?.email ||
      sessionStorage.getItem('user_email') ||
      ''
    ).trim().toLowerCase();
  }

  function getCurrentPage() {
    if (typeof window._current === 'string' && window._current) {
      return normalizePage(window._current);
    }
    const boot = getShellBootstrap();
    if (boot?.page) return normalizePage(boot.page);
    try {
      const url = new URL(window.location.href);
      return normalizePage(url.searchParams.get('page') || 'home');
    } catch (_) {
      return 'home';
    }
  }

  function prettifyNameFromEmail(email) {
    const local = String(email || '').split('@')[0] || '';
    return local
      .replace(/[._-]+/g, ' ')
      .replace(/\b\w/g, c => c.toUpperCase())
      .trim();
  }

  function getInitials(username, email) {
    const src = String(username || email || '').trim();
    if (!src) return '??';
    const parts = src.split(/\s+/).filter(Boolean);
    if (!parts.length) return '??';
    return parts.map(word => word[0] || '').join('').slice(0, 2).toUpperCase();
  }

  function isGasAvailable() {
    return !!(window.google && google.script && google.script.run);
  }

  function setText(id, value) {
    const el = document.getElementById(id);
    if (el && value != null && value !== '') {
      el.textContent = value;
    }
  }

  /* =========================================================
   * ACTIVE NAV
   * ======================================================= */
  function applyActiveNav(page) {
    const nav = $('#navCenter');
    if (!nav) return false;
    const key = normalizePage(page);
    let matched = false;
    nav.querySelectorAll('.nav-item').forEach(item => {
      const isMatch = normalizePage(item.dataset.page) === key;
      item.classList.toggle('active', isMatch);
      if (isMatch) matched = true;
    });
    state.currentPage = key;
    return matched;
  }

  function syncActiveNav() {
    const nav = $('#navCenter');
    if (!nav) return;
    if (typeof window.navigateTo === 'function') {
      applyActiveNav(getCurrentPage());
      return;
    }
    const explicit = normalizePage(window.ACTIVE_PAGE || '');
    if (explicit) {
      applyActiveNav(explicit);
      return;
    }
    try {
      const url = new URL(window.top.location.href);
      applyActiveNav(url.searchParams.get('page') || 'home');
    } catch (_) {
      applyActiveNav('home');
    }
  }

  /* =========================================================
   * AVATAR / USER
   * ======================================================= */
  function setNavbarAvatar(payload) {
    const img = $('#navAvatarImg');
    const initialsEl = $('#navAvatarInitials');
    const username = String(payload?.username || '').trim();
    const email = String(payload?.email || '').trim();
    const initials = getInitials(username, email);

    if (initialsEl) {
      initialsEl.textContent = initials;
      initialsEl.style.display = 'flex';
      initialsEl.style.alignItems = 'center';
      initialsEl.style.justifyContent = 'center';
    }

    if (!img) return;
    let url = String(payload?.avatarUrl || '').trim().replace(/\r?\n|\r/g, '');
    if (!url) {
      img.removeAttribute('src');
      img.style.display = 'none';
      return;
    }
    if (!/^data:/i.test(url) && /^[A-Za-z0-9+/=]+$/.test(url) && url.length > 50) {
      url = 'data:image/jpeg;base64,' + url;
    }
    img.onload = function() {
      img.style.display = 'block';
      if (initialsEl) initialsEl.style.display = 'none';
    };
    img.onerror = function() {
      img.style.display = 'none';
      if (initialsEl) initialsEl.style.display = 'flex';
    };
    img.src = url;
  }

  function applyNavbarUser(user) {
    if (!user) return;
    state.user = user;
    const safeEmail = String(user.email || '').trim().toLowerCase();
    const safeUsername = String(user.username || '').trim();
    const safeRole = String(user.role || '').trim();
    setNavbarAvatar(user);
    setText('dropUserName', safeUsername || prettifyNameFromEmail(safeEmail));
    setText('dropUserRole', safeRole || 'Viewer');
    try {
      sessionStorage.setItem('navbar_user', JSON.stringify(user));
    } catch (_) {}
  }

  function readCachedNavbarUser(email) {
    try {
      const raw = sessionStorage.getItem('navbar_user');
      if (!raw) return null;
      const cached = JSON.parse(raw);
      if (!cached) return null;
      if (normalizePage(cached.email || '') !== normalizePage(email || '')) return null;
      return cached;
    } catch (_) {
      return null;
    }
  }

  function loadNavbarUser() {
    const email = getSessionEmail();
    const boot = getShellBootstrap();

    if (!email) {
      applyNavbarUser({ username: '', email: '', avatarUrl: '', role: 'Viewer' });
      return;
    }

    const bootstrapUser = {
      username: String(boot?.username || '').trim(),
      email: String(boot?.email || email).trim().toLowerCase(),
      avatarUrl: String(boot?.avatarUrl || '').trim(),
      role: String(boot?.role || '').trim()
    };

    if (bootstrapUser.username || bootstrapUser.email) {
      applyNavbarUser({
        username: bootstrapUser.username || prettifyNameFromEmail(email),
        email: bootstrapUser.email,
        avatarUrl: bootstrapUser.avatarUrl,
        role: bootstrapUser.role || 'Viewer'
      });
    } else {
      const cached = readCachedNavbarUser(email);
      if (cached) {
        applyNavbarUser(cached);
      } else {
        applyNavbarUser({ username: prettifyNameFromEmail(email), email, avatarUrl: '', role: 'Viewer' });
      }
    }

    if (!isGasAvailable()) return;

    google.script.run
      .withSuccessHandler(function(me) {
        let payload;
        if (!me) {
          payload = { username: prettifyNameFromEmail(email), email, avatarUrl: '', role: 'Viewer' };
        } else if (typeof me === 'string') {
          payload = { username: prettifyNameFromEmail(email), email, avatarUrl: me, role: 'Viewer' };
        } else {
          payload = {
            username: String(me.username || me.name || prettifyNameFromEmail(email)).trim(),
            email: String(me.email || email).trim().toLowerCase(),
            avatarUrl: String(me.avatarUrl || me.avatar || '').trim(),
            role: String(me.role || 'Viewer').trim()
          };
        }
        applyNavbarUser(payload);
      })
      .withFailureHandler(function() {
        applyNavbarUser({
          username: prettifyNameFromEmail(email),
          email,
          avatarUrl: '',
          role: state.user?.role || 'Viewer'
        });
      })
      .getUserByEmail(email);
  }

  /* =========================================================
   * MENU
   * ======================================================= */
  function closeMenu() {
    const menu = $('#dropMenu');
    const avatar = $('#avatar');
    if (menu) menu.style.display = 'none';
    if (avatar) avatar.setAttribute('aria-expanded', 'false');
  }

  function toggleMenu() {
    const menu = $('#dropMenu');
    const avatar = $('#avatar');
    if (!menu || !avatar) return;
    const isOpen = menu.style.display === 'flex';
    menu.style.display = isOpen ? 'none' : 'flex';
    avatar.setAttribute('aria-expanded', String(!isOpen));
  }

  /* =========================================================
   * NAVIGATION
   * ======================================================= */
  function openModule(page) {
    const key = normalizePage(page);
    if (!key) return;
    try { sessionStorage.setItem('nav_active_page', key); } catch (_) {}
    applyActiveNav(key);
    if (typeof window.navigateTo === 'function') {
      window.navigateTo(key);
      return;
    }
    if (!isGasAvailable()) return;
    google.script.run
      .withSuccessHandler(function(url) {
        window.top.location = url + '?page=' + encodeURIComponent(key);
      })
      .withFailureHandler(function(err) {
        console.error('getAppUrl failed:', err);
      })
      .getAppUrl();
  }

  function goLogin() {
    if (!isGasAvailable()) { window.location.reload(); return; }
    google.script.run
      .withSuccessHandler(function(url) { window.top.location.href = url; })
      .withFailureHandler(function() { window.location.reload(); })
      .getAppUrl();
  }

  /* =========================================================
   * RBAC
   * ======================================================= */
  window.applyNavbarPermissions = function applyNavbarPermissions(perms) {
    const nav = $('#navCenter');
    if (!nav || !perms || !perms.pages) return;
    state.perms = perms;
    const role = String(perms.role || '').trim().toLowerCase();
    const isAdmin = role === 'admin';
    nav.querySelectorAll('.nav-item').forEach(item => {
      const page = normalizePage(item.dataset.page);
      if (!page) return;
      item.style.display = isAdmin || perms.pages[page] ? '' : 'none';
    });
    const adminItem = $('.dropdown-item[data-action="admin"]');
    if (adminItem) {
      adminItem.style.display = isAdmin || perms.pages.admin ? '' : 'none';
    }
    const currentPage = getCurrentPage();
    if (currentPage && perms.pages[currentPage] === false) {
      if (typeof window.navigateTo === 'function') {
        window.navigateTo('home');
      } else {
        openModule('home');
      }
    }
  };

  function loadNavbarPermissions() {
    const boot = getShellBootstrap();
    if (boot?.perms?.pages) {
      window.applyNavbarPermissions(boot.perms);
      return;
    }
    if (!isGasAvailable()) return;
    google.script.run
      .withSuccessHandler(function(perms) { window.applyNavbarPermissions(perms); })
      .withFailureHandler(function(err) { console.warn('getMyPermissions failed:', err); })
      .getMyPermissions();
  }

  /* =========================================================
   * THEME
   * ======================================================= */
  window.toggleTheme = window.toggleTheme || function toggleTheme() {
    const root = document.documentElement;
    const current = root.getAttribute('data-theme') || 'dark';
    const next = current === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (_) {}
  };

  /* =========================================================
   * EVENTS
   * ======================================================= */
  function bindEvents() {
    document.addEventListener('click', function(e) {
      const menu = $('#dropMenu');
      const avatar = $('#avatar');
      if (!menu || !avatar) return;
      if (!menu.contains(e.target) && !avatar.contains(e.target)) closeMenu();
    });

    const brandLogo = $('#brandLogo');
    if (brandLogo) {
      brandLogo.addEventListener('click', function(e) { e.preventDefault(); openModule('home'); });
      brandLogo.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModule('home'); }
      });
    }

    const nav = $('#navCenter');
    if (nav) {
      nav.addEventListener('click', function(e) {
        const item = e.target.closest('.nav-item');
        if (!item) return;
        e.preventDefault();
        openModule(item.dataset.page);
      });
    }

    const avatar = $('#avatar');
    if (avatar) {
      avatar.addEventListener('click', function(e) { e.preventDefault(); toggleMenu(); });
      avatar.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleMenu(); }
        else if (e.key === 'Escape') { e.preventDefault(); closeMenu(); }
      });
    }

    const menu = $('#dropMenu');
    if (menu) {
      menu.addEventListener('click', function(e) {
        const item = e.target.closest('.dropdown-item');
        if (!item) return;
        e.preventDefault();
        closeMenu();
        switch (item.dataset.action) {
          case 'admin':   openModule('admin'); break;
          case 'profile': openModule('profile'); break;
          case 'logout':  goLogin(); break;
        }
      });
    }
  }

  /* =========================================================
   * INIT
   * ======================================================= */
  function init() {
    syncActiveNav();
    loadNavbarUser();
    loadNavbarPermissions();
    bindEvents();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init, { once: true });
  } else {
    init();
  }
})();
</script>
