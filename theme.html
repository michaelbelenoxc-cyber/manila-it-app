
<script>
  (function () {
    const THEME_KEY = "mit_theme";
    const saved = localStorage.getItem(THEME_KEY);
    const systemLight =
      window.matchMedia &&
      window.matchMedia("(prefers-color-scheme: light)").matches;

    const theme =
      saved === "light" || saved === "dark"
        ? saved
        : systemLight
        ? "light"
        : "dark";

    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>

<style>
  /* ========= DEFAULT (DARK) TOKENS ========= */
  :root {
    --bg-body: #000000;
    --bg-surface: #1c1c1e;

    --text-primary: #f5f5f7;
    --text-secondary: #86868b;

    --accent-blue: #2997ff;
    --accent-green: #30d158;
    --accent-red: #ff453a;
    --accent-orange: #ff9500;

    --border-subtle: rgba(255, 255, 255, 0.1);
    --blur-strength: 20px;
    --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.5);

    --radius-md: 12px;
    --radius-lg: 22px;
    --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
      Roboto, Helvetica, Arial, sans-serif;
  }

  /* ========= LIGHT MODE OVERRIDES ========= */
  html[data-theme="light"] {
    --bg-body: #f5f5f7;
    --bg-surface: rgba(255, 255, 255, 0.85);

    --text-primary: #111114;
    --text-secondary: #5a5a63;

    --border-subtle: rgba(0, 0, 0, 0.08);
    --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.12);
  }

 
  html.theme-anim *,
  html.theme-anim *::before,
  html.theme-anim *::after {
    transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease,
      box-shadow 0.25s ease, filter 0.25s ease, opacity 0.25s ease !important;
  }

  /* Apply body background globally — picked up by shell and all pages */
html, body {
  background-color: var(--bg-body);
  color: var(--text-primary);
  margin: 0;
  min-height: 100vh;
}

</style>

<script>
  const THEME_KEY = "mit_theme"; // "light" | "dark"

  function getPreferredTheme() {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved === "light" || saved === "dark") return saved;

    const systemLight =
      window.matchMedia &&
      window.matchMedia("(prefers-color-scheme: light)").matches;

    return systemLight ? "light" : "dark";
  }

  function applyTheme(theme, animate = false) {
    if (animate) {
      document.documentElement.classList.add("theme-anim");
      window.setTimeout(() => document.documentElement.classList.remove("theme-anim"), 350);
    }

    document.documentElement.setAttribute("data-theme", theme);

    // keep navbar button synced if it exists on this page
    const btnIcon = document.querySelector("#themeBtn i");
    const btn = document.getElementById("themeBtn");
    if (btnIcon) btnIcon.className = theme === "light" ? "fas fa-moon" : "fas fa-sun";
    if (btn) btn.setAttribute("data-tip", theme === "light" ? "Switch to Dark Mode" : "Switch to Light Mode");
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme") || getPreferredTheme();
    const next = current === "light" ? "dark" : "light";
    localStorage.setItem(THEME_KEY, next);
    applyTheme(next, true);
  }

  window.addEventListener("load", () => {
    const current = document.documentElement.getAttribute("data-theme") || getPreferredTheme();
    applyTheme(current, false);
  });
</script>
