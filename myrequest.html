<style>
  /* ============================================================
   * FONTS
   * ============================================================ */
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Epilogue:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --font-ui:   'Epilogue', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;

    /* surfaces — warm paper (light default) */
    --bg-0: #f5f2ec; --bg-1: #f5f2ec; --bg-2: #ede9e1;
    --bg-3: #e4ded4; --bg-4: #ddd6ca;

    /* borders */
    --b-0: rgba(26,24,20,.07); --b-1: rgba(26,24,20,.12); --b-2: rgba(26,24,20,.18);

    /* text */
    --t-1: rgba(26,24,20,.95); --t-2: rgba(74,71,64,.75); --t-3: rgba(138,134,128,.60);

    /* primary accent — editorial blue (replaces amber) */
    --am:      #2857a4;
    --am-d:    rgba(40,87,164,.10);
    --am-b:    rgba(40,87,164,.30);
    --am-glow: 0 0 0 1px rgba(40,87,164,.22), 0 3px 12px rgba(40,87,164,.12);

    /* status tokens — light mode muted */
    --st-pending-bg:  rgba(180,83,9,.09);   --st-pending-c:  #b45309;  --st-pending-b:  rgba(180,83,9,.22);
    --st-ack-bg:      rgba(40,87,164,.09);  --st-ack-c:      #2857a4;  --st-ack-b:      rgba(40,87,164,.22);
    --st-approved-bg: rgba(22,163,74,.09);  --st-approved-c: #16a34a;  --st-approved-b: rgba(22,163,74,.22);
    --st-rejected-bg: rgba(201,64,64,.09);  --st-rejected-c: #c94040;  --st-rejected-b: rgba(201,64,64,.22);

    /* geometry */
    --r-xl: 14px; --r-lg: 10px; --r-md: 7px; --r-sm: 5px; --r-pill: 999px;

    /* shadows */
    --sh-2: 0 4px 16px rgba(26,24,20,.10);
    --sh-3: 0 12px 40px rgba(26,24,20,.14);

    --t-fast: .13s ease;
    --accent-red: #c94040;
  }

  /* ── Dark mode ───────────────────────────── */
  html[data-theme="dark"] {
    --bg-0: #161410; --bg-1: #1a1814; --bg-2: #1e1c18; --bg-3: #252220; --bg-4: #2c2a26;
    --b-0: rgba(240,236,227,.06); --b-1: rgba(240,236,227,.10); --b-2: rgba(240,236,227,.16);
    --t-1: rgba(240,236,227,.95); --t-2: rgba(176,169,158,.75); --t-3: rgba(106,100,92,.60);
    --am-d: rgba(40,87,164,.16); --am-b: rgba(40,87,164,.40);
    --am-glow: 0 0 0 1px rgba(40,87,164,.32), 0 3px 12px rgba(40,87,164,.18);
    --st-pending-bg:  rgba(245,158,11,.11); --st-pending-c:  #fbbf24; --st-pending-b:  rgba(245,158,11,.26);
    --st-ack-bg:      rgba(59,130,246,.11); --st-ack-c:      #60a5fa; --st-ack-b:      rgba(59,130,246,.26);
    --st-approved-bg: rgba(34,197,94,.10);  --st-approved-c: #4ade80; --st-approved-b: rgba(34,197,94,.24);
    --st-rejected-bg: rgba(239,68,68,.11);  --st-rejected-c: #f87171; --st-rejected-b: rgba(239,68,68,.26);
    --sh-2: 0 4px 16px rgba(0,0,0,.45); --sh-3: 0 12px 40px rgba(0,0,0,.55);
    --accent-red: #f87171;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-ui); color: var(--t-1); margin: 0;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
    padding-top: 80px; background: var(--bg-0); overflow-x: hidden;
  }

  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 55% 40% at 10% 0%,  rgba(40,87,164,.04) 0%, transparent 55%),
      radial-gradient(ellipse 45% 35% at 92% 100%, rgba(40,87,164,.03) 0%, transparent 55%);
  }

  body > * { position: relative; z-index: 1; }

  /* ── Layout ── */
  .container-main {
    width: 100%; max-width: 1280px; margin: 0 auto;
    padding: 24px 22px 56px;
    animation: fadeUp .36s ease-out both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(9px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .page-title {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: clamp(24px, 3vw, 34px);
    font-weight: 400; letter-spacing: -.02em;
    color: var(--t-1); margin: 0 0 5px; line-height: 1.08;
  }

  .sub {
    font-size: 12.5px; font-family: var(--font-mono);
    color: var(--t-3); margin-bottom: 18px; line-height: 1.6;
    letter-spacing: .01em;
  }

  /* ── Toolbar ── */
  .toolbar {
    display: flex; gap: 7px; align-items: center;
    justify-content: space-between; flex-wrap: wrap; margin-bottom: 13px;
  }

  .search-wrap {
    position: relative; flex: 1; min-width: 210px;
    display: flex; align-items: center;
  }

  .search-wrap i {
    position: absolute; left: 10px; color: var(--t-3);
    font-size: 11px; pointer-events: none;
  }

  .search-wrap .searchBox { width: 100%; padding-left: 28px; }

  .searchBox {
    height: 33px; padding: 0 11px 0 28px;
    background: var(--bg-2); border: 1px solid var(--b-1);
    border-radius: var(--r-lg); color: var(--t-1);
    font-family: var(--font-mono); font-size: 12px; font-weight: 500;
    outline: none;
    transition: border-color var(--t-fast), box-shadow var(--t-fast), background var(--t-fast);
  }

  .searchBox:focus {
    border-color: var(--am-b); background: var(--bg-1); box-shadow: var(--am-glow);
  }

  .searchBox::placeholder { color: var(--t-3); }

  .selectBox {
    height: 33px; padding: 0 10px;
    background: var(--bg-2); border: 1px solid var(--b-1);
    border-radius: var(--r-lg); color: var(--t-1);
    font-family: var(--font-mono); font-size: 11.5px; font-weight: 500;
    min-width: 145px; outline: none; cursor: pointer;
    transition: border-color var(--t-fast);
  }

  .selectBox:focus { border-color: var(--am-b); }
  .selectBox option { background: var(--bg-2); color: var(--t-1); }

  .btnGhost {
    height: 33px; padding: 0 12px;
    background: var(--bg-2); color: var(--t-2);
    border: 1px solid var(--b-1); border-radius: var(--r-lg);
    font-family: var(--font-mono); font-size: 11px; font-weight: 600;
    letter-spacing: .04em; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    white-space: nowrap;
    transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast);
  }

  .btnGhost:hover { background: var(--bg-3); border-color: var(--b-2); color: var(--t-1); }
  .btnGhost:active { transform: scale(.98); }
  .btnGhost:disabled { opacity: .38; cursor: not-allowed; transform: none !important; }
  .btnGhost i { font-size: 10.5px; }

  .btn-danger {
    background: rgba(201,64,64,.09); border-color: rgba(201,64,64,.22); color: var(--accent-red);
  }
  .btn-danger:hover { background: rgba(201,64,64,.16); border-color: rgba(201,64,64,.34); color: var(--accent-red); }

  .btn-primary {
    background: var(--am-d); border-color: var(--am-b); color: var(--am);
  }
  html[data-theme="dark"] .btn-primary { color: #5b85c8; }
  .btn-primary:hover { background: rgba(40,87,164,.16); border-color: rgba(40,87,164,.44); }

  .btn-success {
    background: rgba(22,163,74,.09); border-color: rgba(22,163,74,.22); color: #16a34a;
  }
  html[data-theme="dark"] .btn-success { background: rgba(34,197,94,.10); color: #4ade80; border-color: rgba(34,197,94,.24); }
  .btn-success:hover { background: rgba(22,163,74,.16); border-color: rgba(22,163,74,.34); }

  /* ── Table ── */
  .tableWrap {
    width: 100%; background: var(--bg-1); border-radius: var(--r-xl);
    border: 1px solid var(--b-1); box-shadow: var(--sh-2);
    overflow-x: auto; overflow-y: visible;
  }

  .tableWrap::-webkit-scrollbar { height: 3px; }
  .tableWrap::-webkit-scrollbar-thumb { background: var(--b-2); border-radius: 4px; }

  table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 12.5px; }

  thead { background: var(--bg-0); }
  html[data-theme="dark"] thead { background: rgba(0,0,0,.08); }

  th {
    text-align: left; padding: 9px 13px; color: var(--t-3);
    font-family: var(--font-mono); font-size: 9px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .12em;
    border-bottom: 1px solid var(--b-1); white-space: nowrap;
  }

  td {
    padding: 11px 13px; border-bottom: 1px solid var(--b-0);
    vertical-align: middle; color: var(--t-1);
    transition: background var(--t-fast); overflow: visible;
  }

  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background var(--t-fast); }
  tbody tr:hover td { background: rgba(40,87,164,.03); }
  html[data-theme="dark"] tbody tr:hover td { background: rgba(40,87,164,.06); }

  .mono { font-family: var(--font-mono); font-size: 11.5px; color: var(--t-2); }
  .th-right { text-align: right; }
  .td-right  { text-align: right; }

  /* ── Status pills ── */
  .pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px;
    border-radius: var(--r-sm); font-family: var(--font-mono);
    font-size: 9.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .07em; border: 1px solid; white-space: nowrap;
  }

  .pill::before { content: ''; width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0; }

  .st-pending  { background: var(--st-pending-bg);  color: var(--st-pending-c);  border-color: var(--st-pending-b); }
  .st-pending::before  { background: var(--st-pending-c); animation: dotPulse 1.6s infinite; }
  .st-ack      { background: var(--st-ack-bg);      color: var(--st-ack-c);      border-color: var(--st-ack-b); }
  .st-ack::before      { background: var(--st-ack-c); }
  .st-approved { background: var(--st-approved-bg); color: var(--st-approved-c); border-color: var(--st-approved-b); }
  .st-approved::before { background: var(--st-approved-c); }
  .st-rejected { background: var(--st-rejected-bg); color: var(--st-rejected-c); border-color: var(--st-rejected-b); }
  .st-rejected::before { background: var(--st-rejected-c); }

  @keyframes dotPulse { 0%,100%{opacity:1} 50%{opacity:.22} }

  /* ── Modal ── */
  .modal {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(26,24,20,.44);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    z-index: 9999; padding: 16px;
  }

  html[data-theme="dark"] .modal { background: rgba(0,0,0,.62); backdrop-filter: blur(12px); }

  .modalContent {
    width: min(680px, 96vw);
    background: var(--bg-1); border: 1px solid var(--b-2);
    border-radius: var(--r-xl); box-shadow: var(--sh-3); color: var(--t-1);
    display: flex; flex-direction: column; overflow: hidden;
    animation: modalIn .20s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(.96) translateY(7px); }
    to   { opacity: 1; transform: scale(1)   translateY(0); }
  }

  /* Head */
  .modalHead {
    padding: 14px 18px 12px; border-bottom: 1px solid var(--b-0);
    background: var(--bg-0);
    border-radius: var(--r-xl) var(--r-xl) 0 0;
    flex-shrink: 0; display: flex; align-items: flex-start;
    justify-content: space-between; gap: 11px;
  }

  html[data-theme="dark"] .modalHead { background: rgba(0,0,0,.08); }

  .modalHeadLeft { flex: 1; min-width: 0; }

  .modalEyebrow {
    font-size: 10px; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; color: var(--t-3);
    font-family: var(--font-mono); margin-bottom: 3px;
    display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
  }

  .modalTitle {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 15px; font-weight: 400;
    letter-spacing: -.01em; color: var(--t-1); line-height: 1.2;
  }

  .modalMeta { font-size: 10.5px; color: var(--t-3); margin-top: 2px; font-family: var(--font-mono); }

  .modalCloseBtn {
    width: 26px; height: 26px; border-radius: var(--r-sm);
    border: 1px solid var(--b-1); background: var(--bg-2);
    color: var(--t-3); cursor: pointer; font-size: 11px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: background var(--t-fast), color var(--t-fast);
  }

  .modalCloseBtn:hover { background: var(--bg-3); color: var(--t-1); }

  /* Body */
  .modalBody { padding: 14px 18px; flex: 1; overflow-y: auto; min-height: 0; }
  .modalBody::-webkit-scrollbar { width: 3px; }
  .modalBody::-webkit-scrollbar-thumb { background: var(--b-2); border-radius: 4px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }

  .mfield { display: flex; flex-direction: column; gap: 4px; }

  .mlabel {
    font-family: var(--font-mono); font-size: 9.5px; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase; color: var(--t-3);
  }

  .mval {
    padding: 8px 11px; border-radius: var(--r-md); border: 1px solid var(--b-1);
    background: var(--bg-2); font-size: 12.5px; color: var(--t-1);
    line-height: 1.58; white-space: pre-wrap; word-break: break-word; min-height: 36px;
  }

  .mval.mono { font-family: var(--font-mono); font-size: 11.5px; color: var(--t-2); }

  /* Edit controls */
  .editCtrl {
    width: 100%; padding: 8px 11px; border-radius: var(--r-md);
    border: 1px solid var(--am-b); background: var(--bg-1);
    color: var(--t-1); font-family: var(--font-ui); font-size: 13px;
    outline: none; transition: box-shadow var(--t-fast);
    box-shadow: var(--am-glow);
  }

  .editCtrl:focus { box-shadow: var(--am-glow); }
  .editCtrl option { background: var(--bg-2); color: var(--t-1); }
  textarea.editCtrl { min-height: 76px; resize: vertical; line-height: 1.58; }

  .mDivider { height: 1px; background: var(--b-0); margin: 11px 0; }

  /* Footer */
  .modalFooter {
    padding: 11px 18px 14px; border-top: 1px solid var(--b-0);
    display: flex; justify-content: flex-end; gap: 7px;
    flex-wrap: wrap; flex-shrink: 0;
    border-radius: 0 0 var(--r-xl) var(--r-xl);
  }

  /* lock badge */
  .lock-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: var(--r-pill);
    font-family: var(--font-mono); font-size: 9px; font-weight: 700;
    letter-spacing: .07em; text-transform: uppercase;
    background: var(--b-0); border: 1px solid var(--b-1); color: var(--t-3);
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  .fa-spin { animation: spin .85s linear infinite; }
</style>

<div class="container-main">
  <div class="page-title">My Requests</div>
  <div class="sub" id="who">Loading…</div>

  <div class="toolbar">
    <div class="search-wrap">
      <i class="fas fa-magnifying-glass"></i>
      <input id="q" class="searchBox" placeholder="Search by type, status, date…">
    </div>
    <select id="statusFilter" class="selectBox">
      <option value="">All Status</option>
      <option value="Pending">Pending</option>
      <option value="Acknowledged">Acknowledged</option>
      <option value="Approved">Approved</option>
      <option value="Rejected">Rejected</option>
    </select>
    <button class="btnGhost" type="button" id="refreshBtn">
      <i class="fas fa-rotate"></i> Refresh
    </button>
  </div>

  <div class="tableWrap">
    <table>
      <colgroup>
        <col style="width:160px;">
        <col style="width:90px;">
        <col style="width:210px;">
        <col style="width:110px;">
        <col style="width:150px;">
        <col style="width:120px;">
      </colgroup>
      <thead>
        <tr>
          <th>Submitted</th>
          <th>Type</th>
          <th>Dates</th>
          <th>Priority</th>
          <th>Status</th>
          <th class="th-right">Actions</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr>
          <td colspan="6" style="text-align:center;color:var(--t-3);padding:40px 16px;font-family:var(--font-mono);font-size:12px;">
            <i class="fas fa-circle-notch fa-spin" style="margin-right:8px;"></i> Loading requests…
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ── Request Detail Modal ── -->
<div id="reqModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modalContent">

    <div class="modalHead">
      <div class="modalHeadLeft">
        <div class="modalEyebrow">
          <i class="fas fa-file-lines" style="opacity:.5;"></i>
          <span id="mTypeLabel">Request</span>
          &nbsp;·&nbsp;
          <span id="mStatusPill"></span>
          <span id="mLockBadge" class="lock-badge" style="display:none;"><i class="fas fa-lock" style="font-size:8px;"></i> Locked</span>
        </div>
        <div class="modalTitle" id="mTitle">—</div>
        <div class="modalMeta" id="mSub">—</div>
      </div>
      <button class="modalCloseBtn" type="button" id="closeModalBtn" aria-label="Close">
        <i class="fas fa-xmark"></i>
      </button>
    </div>

    <div class="modalBody">
      <div class="grid2">
        <div class="mfield"><div class="mlabel">Employee</div>          <div class="mval mono" id="mEmail">—</div></div>
        <div class="mfield"><div class="mlabel">Priority</div>          <div class="mval" id="mPriority">—</div></div>
        <div class="mfield"><div class="mlabel">Start Date</div>        <div class="mval mono" id="mStart">—</div></div>
        <div class="mfield"><div class="mlabel">End Date</div>          <div class="mval mono" id="mEnd">—</div></div>
        <div class="mfield"><div class="mlabel">Time / Hours</div>      <div class="mval mono" id="mTime">—</div></div>
        <div class="mfield"><div class="mlabel">Contact While Away</div><div class="mval mono" id="mContact">—</div></div>
      </div>

      <div class="mDivider"></div>

      <div class="mfield" style="margin-bottom:10px;">
        <div class="mlabel">Reason / Details</div>
        <div class="mval" id="mReason" style="min-height:56px;">—</div>
      </div>

      <!-- Attachment — hidden when empty -->
      <div class="mfield" id="mAttachRow" style="display:none;margin-bottom:10px;">
        <div class="mlabel">Attachment</div>
        <div class="mval" id="mAttach">—</div>
      </div>

      <div class="mDivider"></div>

      <div class="grid2">
        <div class="mfield"><div class="mlabel">Reviewed By</div><div class="mval mono" id="mReviewedBy">—</div></div>
        <div class="mfield"><div class="mlabel">Reviewed At</div><div class="mval mono" id="mReviewedAt">—</div></div>
      </div>
    </div>

    <div class="modalFooter">
      <button class="btnGhost btn-danger"  type="button" id="btnDelete" style="display:none;margin-right:auto;"><i class="fas fa-trash"></i> Delete</button>
      <button class="btnGhost btn-success" type="button" id="btnSave"   style="display:none;"><i class="fas fa-check"></i> Save</button>
      <button class="btnGhost"             type="button" id="btnCancel" style="display:none;">Cancel</button>
      <button class="btnGhost btn-primary" type="button" id="btnEdit"   style="display:none;"><i class="fas fa-pen"></i> Edit</button>
      <button class="btnGhost"             type="button" id="btnClose">Close</button>
    </div>

  </div>
</div>

<script>
(() => {
  'use strict';

  const CFG            = { loadTimeoutMs: 8000, debounceMs: 160 };
  const PAGE_KEY       = "myrequest";
  const EDIT_ACTION_KEY= "request.manage";
  const TYPE_OPTIONS   = ["VL","SL","WFH","OT","Schedule Change","Other"];
  const PRIORITY_OPT   = ["Low","Normal","High","Urgent"];
  const MODAL_DISPLAY  = "flex";

  var allMine              = [];
  var filteredMine         = [];
  var signedInEmail        = "";
  var currentRequestId     = "";
  var isEditMode           = false;
  var isBusy               = false;
  var originalSnapshot     = null;
  var filterTimer          = null;

  var auth = {
    email:"", role:"viewer",
    permissions:{ pages:{}, actions:{} },
    canView:false, canEdit:false
  };

  var reqModal = document.getElementById("reqModal");

  function $(id){ return document.getElementById(id); }
  function norm(v){ return String(v == null ? "" : v).trim(); }
  function lower(v){ return norm(v).toLowerCase(); }

  function escapeHtml(s){
    return String(s||"")
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  function normalizeKey(v){
    return String(v||"").replace(/\u00A0/g," ").replace(/[\u200B-\u200D\uFEFF]/g,"")
      .replace(/\s+/g," ").trim().toLowerCase();
  }

  function isGasRuntime(){ return !!(window.google && google.script && google.script.run); }

  function gasCall(fnName){
    var args = [];
    for (var i=1;i<arguments.length;i++) args.push(arguments[i]);
    return new Promise(function(res,rej){
      if (!isGasRuntime()){ rej(new Error("google.script.run not available")); return; }
      var r = google.script.run.withSuccessHandler(res).withFailureHandler(rej);
      r[fnName].apply(r, args);
    });
  }

  function getEmail(){
    return (window.__SHELL_EMAIL__ ||
            sessionStorage.getItem("user_email") ||
            sessionStorage.getItem("email") ||
            localStorage.getItem("user_email") ||
            localStorage.getItem("email") || "").trim().toLowerCase();
  }

  function hasPageAccess(k){ return !!(auth.permissions&&auth.permissions.pages&&auth.permissions.pages[normalizeKey(k)]); }
  function hasActionAccess(k){ return !!(auth.permissions&&auth.permissions.actions&&auth.permissions.actions[normalizeKey(k)]); }

  function applyPermissions(p){
    auth.permissions = p || { pages:{}, actions:{} };
    auth.email    = lower((p&&p.email)||auth.email||getEmail());
    auth.role     = norm((p&&p.role)||"viewer");
    auth.canView  = hasPageAccess(PAGE_KEY);
    auth.canEdit  = auth.canView && hasActionAccess(EDIT_ACTION_KEY);
  }

  async function loadPermissions(){
    auth.email = getEmail();
    applyPermissions({ email:auth.email, role:"viewer", pages:{}, actions:{} });
    if (!isGasRuntime()) return;
    try { var p = await gasCall("getMyPermissions"); applyPermissions(p); }
    catch(e){ console.error("RBAC:",e); }
  }

  function setWho(txt){ var el=$("who"); if(el) el.textContent=txt||""; }

  function renderDenied(){
    var tb=$("tbody");
    if(tb) tb.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--accent-red);padding:40px 14px;">You do not have permission to access My Requests.</td></tr>';
    setWho("Access denied");
    closeModalDirect(true);
  }

  function pillClass(s){
    var v=lower(s||"");
    if(v==="approved")     return "st-approved";
    if(v==="rejected")     return "st-rejected";
    if(v==="acknowledged") return "st-ack";
    return "st-pending";
  }

  function pillHtml(s){
    var label=norm(s)||"Pending";
    return '<span class="pill '+pillClass(label)+'">'+escapeHtml(label)+'</span>';
  }

  function canModify(status){ var s=lower(status||""); return s!=="approved"&&s!=="rejected"; }

  function parseSortDate_(v){
    var s=String(v||"").trim();
    if(!s) return 0;
    var m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})/);
    if(m) return new Date(Number(m[3]),Number(m[1])-1,Number(m[2]),Number(m[4]),Number(m[5])).getTime();
    return new Date(s).getTime()||0;
  }

  function isoNewest(a,b){
    return parseSortDate_((b&&b.submittedAt)||"")-parseSortDate_((a&&a.submittedAt)||"");
  }

  function safeReq(id){ return allMine.find(function(x){ return String(x.id)===String(id); })||null; }

  function mmddToISO(s){
    var m=String(s||"").trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if(!m) return "";
    return m[3]+"-"+m[1]+"-"+m[2];
  }

  function isoToMMDD(s){
    var m=String(s||"").trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(!m) return String(s||"");
    return m[2]+"/"+m[3]+"/"+m[1];
  }

  function stripDatetime(v){
    var s=String(v==null?"":v).trim();
    if(!s) return s;
    var m=s.match(/^(\d{1,2}\/\d{1,2}\/\d{4})/);
    return m?m[1]:s;
  }

  function isRealUrl(v){
    var s=String(v==null?"":v).trim();
    return s.length>7 && s.indexOf("http")===0 &&
           s.indexOf("Upload failed")!==0 && s.indexOf("Cannot")!==0;
  }

  function setBusy(v){
    isBusy=!!v;
    document.querySelectorAll("#reqModal button, .editCtrl").forEach(function(el){
      if(el) el.disabled=!!v;
    });
  }

  function showToast_(msg, type){
    var old=document.getElementById("myreq-toast");
    if(old) old.remove();
    var el=document.createElement("div");
    el.id="myreq-toast";
    var isErr=(type==="error"||type==="danger");
    el.style.cssText=[
      "position:fixed","bottom:20px","left:50%",
      "transform:translateX(-50%)",
      "z-index:99999","padding:10px 16px","border-radius:8px",
      "font-family:var(--font-mono)","font-size:12px","font-weight:600",
      "box-shadow:var(--sh-2)","pointer-events:none","white-space:nowrap",
      isErr
        ? "background:rgba(201,64,64,.12);border:1px solid rgba(201,64,64,.28);color:var(--accent-red);"
        : "background:var(--bg-2);border:1px solid var(--b-2);color:var(--t-1);"
    ].join(";");
    el.textContent=msg;
    document.body.appendChild(el);
    setTimeout(function(){ if(el.parentNode) el.remove(); },3500);
  }

  function showConfirm_(msg, onYes){
    var old=document.getElementById("myreq-confirm");
    if(old) old.remove();
    var backdrop=document.createElement("div");
    backdrop.id="myreq-confirm";
    backdrop.style.cssText=[
      "position:fixed","inset:0","z-index:99998",
      "display:flex","align-items:center","justify-content:center",
      "background:rgba(26,24,20,.44)","backdrop-filter:blur(4px)",
      "-webkit-backdrop-filter:blur(4px)"
    ].join(";");
    var box=document.createElement("div");
    box.style.cssText=[
      "background:var(--bg-1)","border:1px solid var(--b-2)",
      "border-radius:var(--r-xl)","padding:22px 24px",
      "box-shadow:var(--sh-3)","max-width:min(380px,90vw)",
      "display:flex","flex-direction:column","gap:14px"
    ].join(";");
    var p=document.createElement("p");
    p.style.cssText="font-size:13px;color:var(--t-2);line-height:1.6;font-family:var(--font-mono);margin:0;";
    p.textContent=msg;
    var row=document.createElement("div");
    row.style.cssText="display:flex;gap:7px;justify-content:flex-end;";
    var cancel=document.createElement("button");
    cancel.className="btnGhost"; cancel.type="button"; cancel.textContent="Cancel";
    var ok=document.createElement("button");
    ok.className="btnGhost btn-danger"; ok.type="button"; ok.textContent="Confirm";
    cancel.addEventListener("click",function(){ backdrop.remove(); });
    ok.addEventListener("click",function(){ backdrop.remove(); onYes(); });
    row.appendChild(cancel); row.appendChild(ok);
    box.appendChild(p); box.appendChild(row);
    backdrop.appendChild(box);
    document.body.appendChild(backdrop);
    setTimeout(function(){ ok.focus(); },30);
  }

  /* ── Table render ── */
  function render(){
    var tb=$("tbody");
    if(!tb) return;

    var list=filteredMine;
    if(!list.length){
      var isFiltered=(($("q")||{}).value||"").trim()||(($("statusFilter")||{}).value||"").trim();
      var msg=isFiltered?"No requests match your filter.":"You have not submitted any requests yet.";
      tb.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--t-2);padding:40px 14px;font-family:var(--font-mono);font-size:12px;">'+msg+'</td></tr>';
      return;
    }

    tb.innerHTML=list.map(function(r){
      var status=norm(r.status||"Pending");
      var dates=escapeHtml(stripDatetime(r.startDate)||"\u2014")+" \u2192 "+escapeHtml(stripDatetime(r.endDate)||"\u2014");
      var sid=escapeHtml(String(r.id||""));

      return '<tr data-id="'+sid+'">' +
        '<td class="mono">'+escapeHtml(stripDatetime(r.submittedAt)||"\u2014")+'</td>' +
        '<td style="font-weight:700;">'+escapeHtml(r.type||"\u2014")+'</td>' +
        '<td>'+dates+'</td>' +
        '<td>'+escapeHtml(r.priority||"Normal")+'</td>' +
        '<td>'+pillHtml(status)+'</td>' +
        '<td class="td-right">' +
          '<button class="btnGhost btnViewReq" type="button" data-id="'+sid+'" style="height:32px;padding:0 10px;">' +
            '<i class="fas fa-eye"></i> View' +
          '</button>' +
        '</td>' +
      '</tr>';
    }).join("");
  }

  function applyFilters(){
    var q=lower(($("q")||{}).value||"");
    var st=lower(($("statusFilter")||{}).value||"");
    var list=allMine.slice();
    if(st) list=list.filter(function(r){ return lower(r.status||"Pending")===st; });
    if(q)  list=list.filter(function(r){
      var hay=[r.type,r.priority,r.status,r.startDate,r.endDate,r.reason,r.submittedAt]
        .map(function(x){ return lower(x); }).join(" ");
      return hay.indexOf(q)!==-1;
    });
    filteredMine=list;
    render();
  }

  function schedFilter(){ clearTimeout(filterTimer); filterTimer=setTimeout(applyFilters,CFG.debounceMs); }

  /* ── Load ── */
  async function loadMine(){
    var tb=$("tbody");
    if(tb) tb.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--t-3);padding:40px 14px;font-family:var(--font-mono);font-size:12px;"><i class="fas fa-circle-notch fa-spin" style="margin-right:8px;"></i>Loading requests\u2026</td></tr>';

    if(!isGasRuntime()){
      signedInEmail=getEmail();
      setWho(signedInEmail?"Signed in as "+signedInEmail:"");
      allMine=[]; filteredMine=[]; render(); return;
    }

    var tid=null;
    try {
      var res = await Promise.race([
        gasCall("getMyRequests", signedInEmail||auth.email||getEmail()),
        new Promise(function(_,rej){ tid=setTimeout(function(){ rej(new Error("Timed out.")); },CFG.loadTimeoutMs); })
      ]);
      clearTimeout(tid);

      signedInEmail=lower((res&&res.email)||auth.email||getEmail());
      setWho(signedInEmail?"Signed in as "+signedInEmail:"");

      if(!res||res.ok===false){
        if(tb) tb.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--accent-red);padding:40px 14px;">'+escapeHtml((res&&res.error)||"Error loading requests.")+'</td></tr>';
        return;
      }

      allMine=(Array.isArray(res.rows)?res.rows:[]).slice().sort(isoNewest);
      applyFilters();

    } catch(e){
      clearTimeout(tid);
      if(tb) tb.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--accent-red);padding:40px 14px;">Failed to load.<br><small>'+escapeHtml((e&&e.message)||String(e))+'</small></td></tr>';
    }
  }

  /* ── Modal ── */
  function populateModal(r, editMode){
    var typeLabel=$("mTypeLabel");
    var statusPill=$("mStatusPill");
    if(typeLabel)  typeLabel.textContent=norm(r.type)||"Request";
    if(statusPill) statusPill.innerHTML=pillHtml(norm(r.status)||"Pending");

    $("mTitle").textContent=norm(r.email)||"\u2014";
    $("mSub").textContent="Submitted "+(norm(r.submittedAt)||"\u2014");

    var locked=!canModify(r.status)||!auth.canEdit;
    var lb=$("mLockBadge");
    if(lb) lb.style.display=locked?"inline-flex":"none";

    /* Fields */
    function setVal(id,val){
      var el=$(id); if(el){ el.textContent=norm(val)||"\u2014"; }
    }
    setVal("mEmail",      r.email);
    setVal("mPriority",   r.priority);
    setVal("mStart",      stripDatetime(r.startDate));
    setVal("mEnd",        stripDatetime(r.endDate));
    setVal("mTime",       r.timeOrHours);
    setVal("mContact",    r.contact);
    setVal("mReason",     r.reason);
    setVal("mReviewedBy", r.reviewedBy);
    setVal("mReviewedAt", r.reviewedAt);

    /* Attachment */
    var av=norm(r.attachmentName||"");
    var ar=$("mAttachRow"), ael=$("mAttach");
    if(ar&&ael){
      if(isRealUrl(av)){
        ar.style.display="";
        var su=av.replace(/'/g,"%27");
        ael.innerHTML='<a href="'+escapeHtml(av)+'" onclick="window.open(\''+su+'\',\'_blank\');return false;" style="color:#60a5fa;text-decoration:none;display:inline-flex;align-items:center;gap:6px;"><i class="fas fa-external-link-alt" style="font-size:10px;"></i> View attachment</a>';
      } else {
        ar.style.display="none";
        ael.textContent="\u2014";
      }
    }

    /* Buttons */
    var ed=$("btnEdit"), de=$("btnDelete"), sv=$("btnSave"), ca=$("btnCancel");
    if(locked){
      if(ed) ed.style.display="none";
      if(de) de.style.display="none";
    } else {
      if(ed) ed.style.display="inline-flex";
      if(de) de.style.display="inline-flex";
    }
    if(sv) sv.style.display="none";
    if(ca) ca.style.display="none";
  }

  function openDetails(id){
    if(!auth.canView){ renderDenied(); return; }
    if(isEditMode) cancelEdits(true);

    var r=safeReq(id);
    if(!r||!reqModal) return;
    currentRequestId=String(id||"");

    populateModal(r);

    var mb=reqModal.querySelector(".modalBody");
    if(mb) mb.scrollTop=0;

    reqModal.style.display=MODAL_DISPLAY;

    /* reqModal.clientHeight is only valid after display is set.
       position:fixed inset:0 means it equals the true visible iframe height. */
    var _ovH=reqModal.clientHeight||600;
    var _mc=reqModal.querySelector(".modalContent");
    if(_mc) _mc.style.maxHeight=Math.max(300,_ovH-32)+"px";

    requestAnimationFrame(function(){
      var f=reqModal.querySelector("button:not([disabled])");
      if(f) f.focus();
    });
  }

  function isModalOpen(){ return !!(reqModal&&reqModal.style.display===MODAL_DISPLAY); }

  function closeModalDirect(force){
    if(isEditMode&&!force){
      showConfirm_("Discard your unsaved changes?", function(){
        cancelEdits(true);
        if(reqModal) reqModal.style.display="none";
        currentRequestId="";
      });
      return;
    }
    if(reqModal) reqModal.style.display="none";
    currentRequestId="";
  }

  function closeModal(e){ if(e&&e.target===reqModal) closeModalDirect(false); }

  /* ── Edit mode ── */
  function makeSelect(id, value, options){
    var sel=document.createElement("select");
    sel.id=id+"_inp"; sel.className="editCtrl";
    var cv=lower(value||"");
    options.forEach(function(opt){
      var o=document.createElement("option");
      o.value=opt; o.textContent=opt;
      if(lower(opt)===cv) o.selected=true;
      sel.appendChild(o);
    });
    return sel;
  }

  function makeInput(id, value, type, isLong){
    var ctrl=document.createElement(isLong?"textarea":"input");
    ctrl.id=id+"_inp"; ctrl.className="editCtrl";
    if(!isLong) ctrl.type=type||"text";
    if(type==="date") ctrl.value=mmddToISO(value);
    else ctrl.value=(value==="\u2014"?"":String(value||""));
    if(isLong){ ctrl.style.minHeight="80px"; ctrl.style.resize="vertical"; }
    return ctrl;
  }

  function setEditable(id, on){
    if(on){
      var viewEl=$(id); if(!viewEl) return;
      var val=viewEl.textContent||"";
      var ctrl=null;
      if(id==="mStart"||id==="mEnd")    ctrl=makeInput(id,val,"date");
      else if(id==="mPriority")         ctrl=makeSelect(id,val,PRIORITY_OPT);
      else if(id==="mReason")           ctrl=makeInput(id,val,"text",true);
      else                              ctrl=makeInput(id,val,"text");
      viewEl.replaceWith(ctrl);
    } else {
      var inp=$(id+"_inp"); if(!inp) return;
      var div=document.createElement("div");
      div.className="mval"+(id==="mEmail"||id==="mTime"||id==="mContact"||id==="mStart"||id==="mEnd"?" mono":"");
      div.id=id;
      var out="";
      if(inp.tagName==="SELECT")       out=inp.value||"";
      else if(inp.type==="date")       out=isoToMMDD(inp.value||"");
      else                             out=inp.value||"";
      div.textContent=out||"\u2014";
      inp.replaceWith(div);
    }
  }

  var EDIT_FIELDS=["mPriority","mStart","mEnd","mTime","mContact","mReason"];

  function enterEditMode(){
    if(!currentRequestId||isBusy) return;
    if(!auth.canEdit){ showToast_("You do not have permission to edit.","error"); return; }
    var r=safeReq(currentRequestId);
    if(!r) return;
    if(!canModify(r.status)){ showToast_("Approved or rejected requests cannot be edited.","error"); return; }
    originalSnapshot=JSON.parse(JSON.stringify(r));
    isEditMode=true;
    EDIT_FIELDS.forEach(function(id){ setEditable(id,true); });
    var ed=$("btnEdit"),de=$("btnDelete"),sv=$("btnSave"),ca=$("btnCancel");
    if(ed) ed.style.display="none";
    if(de) de.style.display="none";
    if(sv) sv.style.display="inline-flex";
    if(ca) ca.style.display="inline-flex";
  }

  function cancelEdits(silent){
    if(!isEditMode) return;
    EDIT_FIELDS.forEach(function(id){ setEditable(id,false); });
    if(originalSnapshot){
      function tv(id,v){ var el=$(id); if(el) el.textContent=norm(v)||"\u2014"; }
      tv("mPriority", originalSnapshot.priority);
      tv("mStart",    stripDatetime(originalSnapshot.startDate));
      tv("mEnd",      stripDatetime(originalSnapshot.endDate));
      tv("mTime",     originalSnapshot.timeOrHours);
      tv("mContact",  originalSnapshot.contact);
      tv("mReason",   originalSnapshot.reason);
    }
    isEditMode=false; originalSnapshot=null;
    var r=safeReq(currentRequestId);
    var locked=!r||!canModify(r.status)||!auth.canEdit;
    var ed=$("btnEdit"),de=$("btnDelete"),sv=$("btnSave"),ca=$("btnCancel");
    if(ed) ed.style.display=locked?"none":"inline-flex";
    if(de) de.style.display=locked?"none":"inline-flex";
    if(sv) sv.style.display="none";
    if(ca) ca.style.display="none";
  }

  function getInputVal(id){
    var inp=$(id+"_inp"); if(!inp) return "";
    if(inp.tagName==="SELECT") return norm(inp.value);
    if(inp.type==="date") return isoToMMDD(inp.value||"");
    return norm(inp.value);
  }

  async function saveEdits(){
    if(!currentRequestId||isBusy) return;
    if(!auth.canEdit){ showToast_("No permission.","error"); return; }
    var payload={
      priority:    getInputVal("mPriority")||"Normal",
      startDate:   getInputVal("mStart"),
      endDate:     getInputVal("mEnd"),
      timeOrHours: getInputVal("mTime"),
      contact:     getInputVal("mContact"),
      reason:      getInputVal("mReason")
    };
    if(!payload.startDate){ showToast_("Start Date is required.","error"); return; }
    if(!payload.endDate)  { showToast_("End Date is required.","error"); return; }
    if(!payload.reason)   { showToast_("Reason is required.","error"); return; }
    var si=mmddToISO(payload.startDate), ei=mmddToISO(payload.endDate);
    if(!si){ showToast_("Invalid Start Date format.","error"); return; }
    if(!ei){ showToast_("Invalid End Date format.","error"); return; }
    if(ei<si){ showToast_("End Date cannot be before Start Date.","error"); return; }

    setBusy(true);
    try {
      var actor=String(signedInEmail||auth.email||getEmail()).trim().toLowerCase();
      var res=await gasCall("updateRequestById", currentRequestId, payload, actor);
      if(!res||res.ok!==true){ showToast_("Save failed: "+(res&&res.error||"unknown"),"error"); return; }
      var idx=allMine.findIndex(function(x){ return String(x.id)===String(currentRequestId); });
      if(idx>-1) allMine[idx]=Object.assign({},allMine[idx],res.updatedRow);
      cancelEdits(true);
      applyFilters();
      openDetails(currentRequestId);
      showToast_("Changes saved successfully.","success");
    } catch(e){ showToast_("Save failed: "+(e&&e.message||String(e)),"error"); }
    finally { setBusy(false); }
  }

  async function deleteCurrentRequest(){
    if(!currentRequestId||isBusy) return;
    if(!auth.canEdit){ showToast_("No permission.","error"); return; }
    var r=safeReq(currentRequestId);
    if(!r){ showToast_("Request not found.","error"); return; }
    if(!canModify(r.status)){ showToast_("Approved or rejected requests cannot be deleted.","error"); return; }
    var label=(r.type||"Request")+" ("+stripDatetime(r.startDate||"?")+" \u2192 "+stripDatetime(r.endDate||"?")+")";
    showConfirm_("Delete this request?\n"+label+"\n\nThis cannot be undone.", function(){ _doDelete_(); });
    return;
  }

  async function _doDelete_(){
    if(!currentRequestId||isBusy) return;
    setBusy(true);
    try {
      var actor=String(signedInEmail||auth.email||getEmail()).trim().toLowerCase();
      var res=await gasCall("deleteRequestById", currentRequestId, actor);
      if(!res||res.ok!==true){ showToast_("Delete failed: "+(res&&res.error||"unknown"),"error"); return; }
      allMine=allMine.filter(function(x){ return String(x.id)!==String(currentRequestId); });
      closeModalDirect(true);
      applyFilters();
      showToast_("Request deleted.","success");
    } catch(e){ showToast_("Delete failed: "+(e&&e.message||String(e)),"error"); }
    finally { setBusy(false); }
  }

  /* ── Init ── */
  var bound_=false;

  async function init(){
    await loadPermissions();
    signedInEmail=auth.email||getEmail();
    setWho(signedInEmail?"Signed in as "+signedInEmail:"");

    if(!bound_){
      /* table */
      var tb=document.getElementById("tbody");
      if(tb) tb.addEventListener("click",function(e){
        var btn=e.target.closest(".btnViewReq");
        if(btn) openDetails(btn.getAttribute("data-id"));
      });
      /* toolbar */
      var q=$("q"),sf=$("statusFilter"),rb=$("refreshBtn");
      if(q)  q.addEventListener("input",schedFilter);
      if(sf) sf.addEventListener("change",applyFilters);
      if(rb) rb.addEventListener("click",loadMine);
      /* modal */
      if(reqModal) reqModal.addEventListener("click",closeModal);
      var cx=$("closeModalBtn"), cf=$("btnClose");
      if(cx) cx.addEventListener("click",function(){ closeModalDirect(false); });
      if(cf) cf.addEventListener("click",function(){ closeModalDirect(false); });
      var be=$("btnEdit"),bs=$("btnSave"),bc=$("btnCancel"),bd=$("btnDelete");
      if(be) be.addEventListener("click",enterEditMode);
      if(bs) bs.addEventListener("click",saveEdits);
      if(bc) bc.addEventListener("click",function(){ cancelEdits(false); });
      if(bd) bd.addEventListener("click",deleteCurrentRequest);
      /* escape */
      document.addEventListener("keydown",function(e){
        if(e.key!=="Escape") return;
        if(isModalOpen()) closeModalDirect(false);
      });
      bound_=true;
    }

    if(!auth.canView){ renderDenied(); return; }
    loadMine();
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",init,{once:true});
  } else {
    init();
  }

  window.openDetails       = openDetails;
  window.closeModal        = closeModal;
  window.closeModalDirect  = closeModalDirect;
  window.enterEditMode     = enterEditMode;
  window.cancelEdits       = cancelEdits;
  window.saveEdits         = saveEdits;
  window.deleteCurrentRequest = deleteCurrentRequest;
  window.loadMine          = loadMine;

})();
</script>
